[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx
autostart=true
autorestart=true
priority=20
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:transcription]
command=php /app/artisan queue:work database --queue=transcription,default --sleep=3 --tries=3 --timeout=720 --max-time=3600
directory=/app
user=www-data
numprocs=1
autostart=true
autorestart=true
priority=30
stopasgroup=true
killasgroup=true
startsecs=0
stopwaitsecs=900
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:lightweight]
command=php /app/artisan queue:work database --queue=lightweight,ingest --sleep=3 --tries=3 --timeout=720 --max-time=3600
directory=/app
user=www-data
numprocs=1
autostart=true
autorestart=true
priority=30
stopasgroup=true
killasgroup=true
startsecs=0
stopwaitsecs=900
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
