expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
post_max_size = 35M
upload_max_filesize = 30M
max_execution_time = 300
; Precaution for CVE-2026-115560; applied before request parsing.
session.upload_progress.enabled = Off
opcache.enable = 1
opcache.validate_timestamps = 0
