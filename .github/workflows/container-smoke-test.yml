name: Container smoke test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  container:
    name: Production container smoke test
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
        run: |
          docker build --pull \
            --secret id=FLUX_USERNAME,env=FLUX_USERNAME \
            --secret id=FLUX_LICENSE_KEY,env=FLUX_LICENSE_KEY \
            --tag search-my-audio:test .
      - name: Run container smoke test
        run: bash docker/smoke-test.sh search-my-audio:test
